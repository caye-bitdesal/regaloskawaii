# Builds the static site from the production EmDash and publishes it to Cloudflare Pages.
#
# Triggers: push to main, the EmDash "notify GitHub" plugin (repository_dispatch),
# a daily safety-net build and manual runs (Actions → "Build and deploy" → Run workflow).
#
# EmDash runs on the Cloudflare Workers free plan (very little CPU per request), so:
#   - builds started by the panel wait 3 minutes before touching EmDash. Every publish
#     sends a notification and each new run cancels the previous one (concurrency below),
#     so a script that publishes 50 products ends up as ONE build, not 50;
#   - downloaded images (public/media) are cached between runs: only new ones are
#     downloaded from EmDash.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   - Variable  EMDASH_URL            = https://admin.regaloskawaii.es
#   - Secret    EMDASH_TOKEN          = EmDash "web-build" token (content:read + media:read only)
#   - Secret    CLOUDFLARE_API_TOKEN  = Cloudflare token with Account → Cloudflare Pages → Edit
#   - Secret    CLOUDFLARE_ACCOUNT_ID = Cloudflare account ID
name: Build and deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC every day

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Debounce: wait for the burst of panel notifications to end before building.
      - name: Wait for more content changes
        if: github.event_name == 'repository_dispatch'
        run: sleep 180

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check configuration
        env:
          EMDASH_URL: ${{ vars.EMDASH_URL }}
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
        run: |
          missing=0
          [ -n "$EMDASH_URL" ]   || { echo "::error::Missing repository variable EMDASH_URL (Settings → Secrets and variables → Actions → Variables)"; missing=1; }
          [ -n "$EMDASH_TOKEN" ] || { echo "::error::Missing repository secret EMDASH_TOKEN (Settings → Secrets and variables → Actions → Secrets)"; missing=1; }
          exit $missing

      - name: Install dependencies
        run: npm ci

      # EmDash media keys never change content: reuse the images of the previous build.
      - name: Restore downloaded images
        uses: actions/cache@v4
        with:
          path: public/media
          key: media-${{ github.run_id }}
          restore-keys: media-

      - name: Build (fetch content and images from EmDash)
        run: npm run build
        env:
          EMDASH_URL: ${{ vars.EMDASH_URL }}
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
          REFRESH_CONTENT: "1"

      - name: Check that no token leaked into the build
        env:
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
        run: |
          if [ -n "$EMDASH_TOKEN" ] && grep -rqF -- "$EMDASH_TOKEN" dist; then
            echo "::error::EMDASH_TOKEN found in dist/"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=regaloskawaii-web --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}